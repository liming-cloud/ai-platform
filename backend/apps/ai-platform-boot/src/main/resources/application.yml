server:
  port: ${AI_PLATFORM_SERVER_PORT:8080}

spring:
  application:
    name: ai-platform
  datasource:
    url: ${AI_PLATFORM_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_platform}
    username: ${AI_PLATFORM_POSTGRES_USER:ai_platform}
    password: ${AI_PLATFORM_POSTGRES_PASSWORD:ai_platform_dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${AI_PLATFORM_REDIS_HOST:localhost}
      port: ${AI_PLATFORM_REDIS_PORT:6379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

sa-token:
  token-name: satoken
  timeout: 86400
  active-timeout: 7200
  is-read-cookie: false
  is-read-header: true
  is-share: false
  is-log: false

management:
  endpoints:
    web:
      exposure:
        include: health

ai:
  platform:
    secret:
      master-key: ${AI_PLATFORM_SECRET_MASTER_KEY:ai-platform-local-secret-change-me}
    bootstrap:
      enabled: ${AI_PLATFORM_BOOTSTRAP_ENABLED:true}
      tenant-code: ${AI_PLATFORM_BOOTSTRAP_TENANT_CODE:demo}
      tenant-name: ${AI_PLATFORM_BOOTSTRAP_TENANT_NAME:演示租户}
      admin-username: ${AI_PLATFORM_BOOTSTRAP_ADMIN_USERNAME:admin}
      admin-display-name: ${AI_PLATFORM_BOOTSTRAP_ADMIN_DISPLAY_NAME:平台管理员}
      admin-password: ${AI_PLATFORM_BOOTSTRAP_ADMIN_PASSWORD:AiPlatform2026!}
    model:
      bootstrap:
        openai:
          enabled: ${AI_PLATFORM_OPENAI_BOOTSTRAP_ENABLED:true}
          tenant-code: ${AI_PLATFORM_BOOTSTRAP_TENANT_CODE:demo}
          provider-name: ${AI_PLATFORM_OPENAI_PROVIDER_NAME:OpenAI}
          api-key: ${AI_PLATFORM_OPENAI_API_KEY:${OPEN_AI_APIKEY:}}
          chat-model: ${AI_PLATFORM_OPENAI_CHAT_MODEL:o3}
          budget-usd: ${AI_PLATFORM_OPENAI_BUDGET_USD:5}
          context-window: ${AI_PLATFORM_OPENAI_CONTEXT_WINDOW:200000}
          max-output-tokens: ${AI_PLATFORM_OPENAI_MAX_OUTPUT_TOKENS:1024}
          reasoning-effort: ${AI_PLATFORM_OPENAI_REASONING_EFFORT:medium}
