spring:
  application:
    name: control-plane
  main:
    banner-mode: "off"
  flyway:
    locations:
      - classpath:db/migration/organization-access
      - classpath:db/migration/knowledge-data
      - classpath:db/migration/model-runtime
      - classpath:db/migration/assistant-delivery
      - classpath:db/migration/trusted-query
      - classpath:db/migration/evaluation-operations
  data:
    redis:
      repositories:
        enabled: false

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 3600
  active-timeout: 1800
  is-concurrent: false
  is-share: false
  is-read-cookie: false
  is-read-header: true
  is-read-body: false
  auto-renew: true

foundation:
  application-role-validation:
    enabled: true
  control-plane:
    enabled: true
  organization-access:
    enabled: true
  persistence:
    snowflake:
      worker-id: ${FOUNDATION_SNOWFLAKE_WORKER_ID}
      datacenter-id: ${FOUNDATION_SNOWFLAKE_DATACENTER_ID}
  assistant-delivery:
    enabled: true
  evaluation-operations:
    enabled: true
    persistence:
      enabled: true
    # 本地最小启动不连接对象存储；部署覆盖层显式开启，避免没有私有存储时伪成功。
    object-storage:
      enabled: false
  knowledge-data:
    enabled: true
    persistence:
      enabled: true
    object-storage:
      enabled: false
  query:
    quota:
      daily-limit: ${FOUNDATION_QUERY_QUOTA_DAILY_LIMIT:100}
      concurrent-limit: ${FOUNDATION_QUERY_QUOTA_CONCURRENT_LIMIT:4}
      running-lease: ${FOUNDATION_QUERY_QUOTA_RUNNING_LEASE:PT2M}
  model-catalog:
    enabled: true
    # 只有控制面进程承担人员浏览器与 HTTP 管理入口；运行时和工作器只消费受控模型能力。
    web:
      enabled: true
    provider-connection-limit: ${FOUNDATION_PROVIDER_CONNECTION_LIMIT:3}
    model-deployment-limit: ${FOUNDATION_MODEL_DEPLOYMENT_LIMIT:6}
  model-runtime:
    enabled: true
    persistence:
      enabled: true
    allowed-endpoints: ${MODEL_ALLOWED_ENDPOINTS:}
    call-timeout: ${MODEL_CALL_TIMEOUT:PT30S}
    cache-maximum-size: ${MODEL_RUNTIME_CACHE_MAXIMUM_SIZE:64}
    cache-idle-timeout: ${MODEL_RUNTIME_CACHE_IDLE_TIMEOUT:PT30M}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
