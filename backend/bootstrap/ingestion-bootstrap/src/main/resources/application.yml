spring:
  application:
    name: ingestion-worker
  main:
    banner-mode: "off"
  flyway:
    enabled: false

foundation:
  application-role-validation:
    enabled: true
  knowledge-data:
    persistence:
      enabled: true
  vector-store:
    pgvector:
      enabled: true
  model-runtime:
    enabled: true
    persistence:
      enabled: true
    allowed-endpoints: ${MODEL_ALLOWED_ENDPOINTS:}
    call-timeout: ${MODEL_CALL_TIMEOUT:PT30S}
    cache-maximum-size: ${MODEL_RUNTIME_CACHE_MAXIMUM_SIZE:64}
    cache-idle-timeout: ${MODEL_RUNTIME_CACHE_IDLE_TIMEOUT:PT30M}
  # 工作器在索引构建时按创建成员重验受控嵌入配置，不能退回旧部署解析器。
  model-catalog:
    enabled: true
  persistence:
    snowflake:
      worker-id: ${FOUNDATION_SNOWFLAKE_WORKER_ID}
      datacenter-id: ${FOUNDATION_SNOWFLAKE_DATACENTER_ID}
  ingestion:
    enabled: true

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
