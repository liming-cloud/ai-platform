spring:
  application:
    name: control-plane
  main:
    banner-mode: "off"
  flyway:
    locations:
      - classpath:db/migration/organization-access
      - classpath:db/migration/knowledge-data
      - classpath:db/migration/model-runtime
      - classpath:db/migration/assistant-delivery
  data:
    redis:
      repositories:
        enabled: false

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 3600
  active-timeout: 1800
  is-concurrent: false
  is-share: false
  is-read-cookie: false
  is-read-header: true
  is-read-body: false
  auto-renew: true

foundation:
  assistant-delivery:
    enabled: true
  knowledge-data:
    object-storage:
      enabled: false
  model-runtime:
    enabled: true
    allowed-endpoints: ${MODEL_ALLOWED_ENDPOINTS:}
    call-timeout: ${MODEL_CALL_TIMEOUT:PT30S}
    cache:
      maximum-size: ${MODEL_RUNTIME_CACHE_MAXIMUM_SIZE:64}
      idle-timeout: ${MODEL_RUNTIME_CACHE_IDLE_TIMEOUT:PT30M}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
