spring:
  application:
    name: ingestion-worker
  main:
    banner-mode: "off"
  flyway:
    enabled: false

foundation:
  ingestion:
    enabled: false

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
