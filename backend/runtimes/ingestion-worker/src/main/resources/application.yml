spring:
  application:
    name: ingestion-worker
  main:
    banner-mode: "off"
  flyway:
    enabled: false

foundation:
  knowledge-data:
    persistence:
      enabled: true
  vector-store:
    pgvector:
      enabled: true
  persistence:
    snowflake:
      worker-id: ${FOUNDATION_SNOWFLAKE_WORKER_ID}
      datacenter-id: ${FOUNDATION_SNOWFLAKE_DATACENTER_ID}
  ingestion:
    enabled: false

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
