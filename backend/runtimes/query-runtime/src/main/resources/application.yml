spring:
  application:
    name: query-runtime
  main:
    banner-mode: "off"
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 3600
  active-timeout: 1800
  is-concurrent: false
  is-share: false
  is-read-cookie: false
  is-read-header: true
  is-read-body: false
  auto-renew: true

foundation:
  knowledge-data:
    persistence:
      enabled: true
  vector-store:
    pgvector:
      enabled: true
  model-runtime:
    enabled: true
    persistence:
      enabled: true
    cache-maximum-size: ${MODEL_RUNTIME_CACHE_MAXIMUM_SIZE:64}
    cache-idle-timeout: ${MODEL_RUNTIME_CACHE_IDLE_TIMEOUT:PT30M}
  persistence:
    snowflake:
      worker-id: ${FOUNDATION_SNOWFLAKE_WORKER_ID}
      datacenter-id: ${FOUNDATION_SNOWFLAKE_DATACENTER_ID}
  query:
    enabled: false
    quota:
      daily-limit: ${FOUNDATION_QUERY_QUOTA_DAILY_LIMIT:100}
      concurrent-limit: ${FOUNDATION_QUERY_QUOTA_CONCURRENT_LIMIT:4}
      running-lease: ${FOUNDATION_QUERY_QUOTA_RUNNING_LEASE:PT2M}

server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
