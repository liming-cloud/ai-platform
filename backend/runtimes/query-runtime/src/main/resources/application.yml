spring:
  application:
    name: query-runtime
  main:
    banner-mode: "off"
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 3600
  active-timeout: 1800
  is-concurrent: false
  is-share: false
  is-read-cookie: false
  is-read-header: true
  is-read-body: false
  auto-renew: true

foundation:
  query:
    enabled: false
    quota:
      daily-limit: ${FOUNDATION_QUERY_QUOTA_DAILY_LIMIT:100}
      concurrent-limit: ${FOUNDATION_QUERY_QUOTA_CONCURRENT_LIMIT:4}
      running-lease: ${FOUNDATION_QUERY_QUOTA_RUNNING_LEASE:PT2M}

server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
