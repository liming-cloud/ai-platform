management:
  health:
    mail:
      enabled: ${AIP_IDENTITY_INVITATION_MAIL_ENABLED:false}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        readiness:
          include: readinessState,db,redis,minio,binders,rocketmq
  endpoints:
    web:
      exposure:
        include: health,info
