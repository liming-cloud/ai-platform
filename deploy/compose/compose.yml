name: ${FOUNDATION_COMPOSE_PROJECT_NAME:-trusted-rag-foundation-v1}

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg18-trixie@sha256:9d2e61c7352b9e9f4798df5fd9a498f043f4cda1cdacc707de3d198650f4321e
    environment:
      POSTGRES_DB: ${FOUNDATION_POSTGRES_DATABASE:?必须设置数据库名称}
      POSTGRES_USER: ${FOUNDATION_POSTGRES_USER:?必须设置数据库用户}
      POSTGRES_PASSWORD: ${FOUNDATION_POSTGRES_PASSWORD:?必须设置数据库密码}
    volumes:
      # PostgreSQL 18 使用按主版本分层的数据目录，卷必须挂载在其父目录。
      - foundation_v1_postgres:/var/lib/postgresql
    networks:
      - foundation-internal
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8.8.1-trixie@sha256:c88d347edef6249a6d2293f926f1eeb48bd40c57cbcd02c07f52e7f1fd2cb46b
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${FOUNDATION_REDIS_PASSWORD:?必须设置 Redis 密码}
    volumes:
      - foundation_v1_redis:/data
    networks:
      - foundation-internal
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${FOUNDATION_REDIS_PASSWORD}" ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      FOUNDATION_REDIS_PASSWORD: ${FOUNDATION_REDIS_PASSWORD:?必须设置 Redis 密码}
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${FOUNDATION_MINIO_USER:?必须设置对象存储用户}
      MINIO_ROOT_PASSWORD: ${FOUNDATION_MINIO_PASSWORD:?必须设置对象存储密码}
    volumes:
      - foundation_v1_minio:/data
    networks:
      - foundation-internal
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/images/backend.Dockerfile
      args:
        RUNTIME: control-plane
    image: trusted-rag/control-plane:foundation-v1
    environment:
      SERVER_PORT: "8080"
      # 本地研发基线只执行正式迁移；平台超级管理员由受控本地重置建立，不能回灌演示成员和租户。
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${FOUNDATION_POSTGRES_DATABASE:?必须设置数据库名称}
      SPRING_DATASOURCE_USERNAME: ${FOUNDATION_POSTGRES_USER:?必须设置数据库用户}
      SPRING_DATASOURCE_PASSWORD: ${FOUNDATION_POSTGRES_PASSWORD:?必须设置数据库密码}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${FOUNDATION_REDIS_PASSWORD:?必须设置 Redis 密码}
      FOUNDATION_SNOWFLAKE_WORKER_ID: ${FOUNDATION_CONTROL_PLANE_SNOWFLAKE_WORKER_ID:-0}
      FOUNDATION_SNOWFLAKE_DATACENTER_ID: ${FOUNDATION_SNOWFLAKE_DATACENTER_ID:-0}
      # 本地模型凭据只由控制面加密保存，缺失时模型配置读取入口必须失败关闭。
      FOUNDATION_MODEL_CREDENTIALS_LOCAL_DEVELOPMENT_KEY_VERSION: ${FOUNDATION_MODEL_CREDENTIALS_LOCAL_DEVELOPMENT_KEY_VERSION:?必须设置本地模型凭据密钥版本}
      FOUNDATION_SECRET_ENCRYPTION_KEY_M2_V1: ${FOUNDATION_SECRET_ENCRYPTION_KEY_M2_V1:?必须设置 Base64 编码的本地模型凭据主密钥}
      FOUNDATION_KNOWLEDGE_DATA_OBJECT_STORAGE_ENABLED: "true"
      FOUNDATION_KNOWLEDGE_DATA_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      FOUNDATION_KNOWLEDGE_DATA_OBJECT_STORAGE_ACCESS_KEY: ${FOUNDATION_MINIO_USER:?必须设置对象存储用户}
      FOUNDATION_KNOWLEDGE_DATA_OBJECT_STORAGE_SECRET_KEY: ${FOUNDATION_MINIO_PASSWORD:?必须设置对象存储密码}
      FOUNDATION_KNOWLEDGE_DATA_OBJECT_STORAGE_BUCKET: foundation-v1-private
      FOUNDATION_KNOWLEDGE_DATA_OBJECT_STORAGE_CREATE_BUCKET_IF_MISSING: "true"
      FOUNDATION_EVALUATION_OPERATIONS_OBJECT_STORAGE_ENABLED: "true"
      FOUNDATION_EVALUATION_OPERATIONS_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      FOUNDATION_EVALUATION_OPERATIONS_OBJECT_STORAGE_ACCESS_KEY: ${FOUNDATION_MINIO_USER:?必须设置对象存储用户}
      FOUNDATION_EVALUATION_OPERATIONS_OBJECT_STORAGE_SECRET_KEY: ${FOUNDATION_MINIO_PASSWORD:?必须设置对象存储密码}
      FOUNDATION_EVALUATION_OPERATIONS_OBJECT_STORAGE_BUCKET: foundation-v1-private
      FOUNDATION_EVALUATION_OPERATIONS_OBJECT_STORAGE_CREATE_BUCKET_IF_MISSING: "true"
      FOUNDATION_QUERY_QUOTA_DAILY_LIMIT: ${FOUNDATION_QUERY_QUOTA_DAILY_LIMIT:-100}
      FOUNDATION_QUERY_QUOTA_CONCURRENT_LIMIT: ${FOUNDATION_QUERY_QUOTA_CONCURRENT_LIMIT:-4}
      FOUNDATION_QUERY_QUOTA_RUNNING_LEASE: ${FOUNDATION_QUERY_QUOTA_RUNNING_LEASE:-PT2M}
      # 浏览器会话默认一小时；本地验收覆盖层可短暂缩短它以验证自然过期后的失败关闭。
      FOUNDATION_SECURITY_SESSION_TIMEOUT: ${FOUNDATION_SECURITY_SESSION_TIMEOUT:-PT1H}
      # 模型调用仍由显式完整 Endpoint 白名单约束；空值保持默认拒绝，不使用域名通配。
      MODEL_ALLOWED_ENDPOINTS: ${MODEL_ALLOWED_ENDPOINTS:-}
      MODEL_CALL_TIMEOUT: ${MODEL_CALL_TIMEOUT:-PT60S}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FOUNDATION_CONTROL_PLANE_PORT:-18080}:8080"
    networks:
      - foundation-internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  query-runtime:
    build:
      context: ../..
      dockerfile: deploy/images/backend.Dockerfile
      args:
        RUNTIME: query-runtime
    image: trusted-rag/query-runtime:foundation-v1
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${FOUNDATION_POSTGRES_DATABASE:?必须设置数据库名称}
      SPRING_DATASOURCE_USERNAME: ${FOUNDATION_POSTGRES_USER:?必须设置数据库用户}
      SPRING_DATASOURCE_PASSWORD: ${FOUNDATION_POSTGRES_PASSWORD:?必须设置数据库密码}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${FOUNDATION_REDIS_PASSWORD:?必须设置 Redis 密码}
      FOUNDATION_SNOWFLAKE_WORKER_ID: ${FOUNDATION_QUERY_RUNTIME_SNOWFLAKE_WORKER_ID:-1}
      FOUNDATION_SNOWFLAKE_DATACENTER_ID: ${FOUNDATION_SNOWFLAKE_DATACENTER_ID:-0}
      FOUNDATION_QUERY_ENABLED: "true"
      FOUNDATION_QUERY_QUOTA_DAILY_LIMIT: ${FOUNDATION_QUERY_QUOTA_DAILY_LIMIT:-100}
      FOUNDATION_QUERY_QUOTA_CONCURRENT_LIMIT: ${FOUNDATION_QUERY_QUOTA_CONCURRENT_LIMIT:-4}
      FOUNDATION_QUERY_QUOTA_RUNNING_LEASE: ${FOUNDATION_QUERY_QUOTA_RUNNING_LEASE:-PT2M}
      # 查询运行时只调用与控制面相同的显式完整 Endpoint 白名单。
      MODEL_ALLOWED_ENDPOINTS: ${MODEL_ALLOWED_ENDPOINTS:-}
      MODEL_CALL_TIMEOUT: ${MODEL_CALL_TIMEOUT:-PT60S}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FOUNDATION_QUERY_RUNTIME_PORT:-18081}:8081"
    networks:
      - foundation-internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  ingestion-worker:
    build:
      context: ../..
      dockerfile: deploy/images/backend.Dockerfile
      args:
        RUNTIME: ingestion-worker
    image: trusted-rag/ingestion-worker:foundation-v1
    environment:
      SERVER_PORT: "8082"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${FOUNDATION_POSTGRES_DATABASE:?必须设置数据库名称}
      SPRING_DATASOURCE_USERNAME: ${FOUNDATION_POSTGRES_USER:?必须设置数据库用户}
      SPRING_DATASOURCE_PASSWORD: ${FOUNDATION_POSTGRES_PASSWORD:?必须设置数据库密码}
      FOUNDATION_INGESTION_ENABLED: "true"
      FOUNDATION_SNOWFLAKE_WORKER_ID: "2"
      FOUNDATION_SNOWFLAKE_DATACENTER_ID: "0"
      # 摄取工作器按冻结模型配置执行嵌入，必须使用与控制面相同的本地凭据主密钥解密短生命周期凭据。
      FOUNDATION_MODEL_CREDENTIALS_LOCAL_DEVELOPMENT_KEY_VERSION: ${FOUNDATION_MODEL_CREDENTIALS_LOCAL_DEVELOPMENT_KEY_VERSION:?必须设置本地模型凭据密钥版本}
      FOUNDATION_SECRET_ENCRYPTION_KEY_M2_V1: ${FOUNDATION_SECRET_ENCRYPTION_KEY_M2_V1:?必须设置 Base64 编码的本地模型凭据主密钥}
      # 嵌入调用与在线查询共享同一显式完整 Endpoint 白名单。
      MODEL_ALLOWED_ENDPOINTS: ${MODEL_ALLOWED_ENDPOINTS:-}
      MODEL_CALL_TIMEOUT: ${MODEL_CALL_TIMEOUT:-PT60S}
      FOUNDATION_INGESTION_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      FOUNDATION_INGESTION_OBJECT_STORAGE_ACCESS_KEY: ${FOUNDATION_MINIO_USER:?必须设置对象存储用户}
      FOUNDATION_INGESTION_OBJECT_STORAGE_SECRET_KEY: ${FOUNDATION_MINIO_PASSWORD:?必须设置对象存储密码}
      FOUNDATION_INGESTION_OBJECT_STORAGE_BUCKET: foundation-v1-private
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FOUNDATION_INGESTION_WORKER_PORT:-18082}:8082"
    networks:
      - foundation-internal
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  console-web:
    build:
      context: ../..
      dockerfile: deploy/images/frontend.Dockerfile
      args:
        APP: console-web
    image: trusted-rag/console-web:foundation-v1
    depends_on:
      control-plane:
        condition: service_healthy
      query-runtime:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FOUNDATION_CONSOLE_WEB_PORT:-13000}:8080"
    networks:
      - foundation-internal
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

networks:
  foundation-internal:
    name: ${FOUNDATION_NETWORK_NAME:-trusted-rag-foundation-v1}

volumes:
  foundation_v1_postgres:
    name: ${FOUNDATION_POSTGRES_VOLUME_NAME:-trusted-rag-foundation-v1-postgres}
  foundation_v1_redis:
    name: ${FOUNDATION_REDIS_VOLUME_NAME:-trusted-rag-foundation-v1-redis}
  foundation_v1_minio:
    name: ${FOUNDATION_MINIO_VOLUME_NAME:-trusted-rag-foundation-v1-minio}
