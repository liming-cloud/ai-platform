# M2 真实模型受控验收覆盖层：仅与基础 compose 联用，不在默认演示中启用。
# API Key 通过受控 HTTP 创建接口写入数据库密文，绝不作为容器环境变量传入。
services:
  control-plane:
    environment:
      FOUNDATION_MODEL_CREDENTIALS_LOCAL_DEVELOPMENT_KEY_VERSION: M2_V1
      FOUNDATION_SECRET_ENCRYPTION_KEY_M2_V1: ${FOUNDATION_SECRET_ENCRYPTION_KEY_M2_V1:?必须设置 Base64 编码的 32 字节本地研发主密钥}
      MODEL_ALLOWED_ENDPOINTS: ${MODEL_ALLOWED_ENDPOINTS:?必须设置受控 HTTPS 模型端点}
      MODEL_CALL_TIMEOUT: ${MODEL_CALL_TIMEOUT:-PT20S}

  query-runtime:
    environment:
      FOUNDATION_MODEL_CREDENTIALS_LOCAL_DEVELOPMENT_KEY_VERSION: M2_V1
      FOUNDATION_SECRET_ENCRYPTION_KEY_M2_V1: ${FOUNDATION_SECRET_ENCRYPTION_KEY_M2_V1:?必须设置 Base64 编码的 32 字节本地研发主密钥}
      MODEL_ALLOWED_ENDPOINTS: ${MODEL_ALLOWED_ENDPOINTS:?必须设置受控 HTTPS 模型端点}
      MODEL_CALL_TIMEOUT: ${MODEL_CALL_TIMEOUT:-PT20S}
