server {
    listen 8080;
    listen 8443 ssl;
    server_name localhost;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 仅由本机验收覆盖层挂载；私钥位于未提交且 0600 的本地目录。
    ssl_certificate /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 发布新镜像后必须重新校验入口，避免旧 HTML 引用已替换的哈希分包。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # 根目录会先命中目录索引；在此处同样强制重新校验，避免绕过入口缓存策略。
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    # 查询运行时只服务已明确的查询契约，其他控制面 API 继续由默认代理处理。
    location ^~ /api/v1/query-assistants {
        set $query_runtime_upstream http://query-runtime:8081;
        proxy_pass $query_runtime_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    location ^~ /api/v1/query-runs {
        set $query_runtime_upstream http://query-runtime:8081;
        proxy_pass $query_runtime_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    location /api/ {
        set $control_plane_upstream http://control-plane:8080;
        proxy_pass $control_plane_upstream;
        proxy_http_version 1.1;
        # HTTPS 公共 Host 必须逐字传递给控制面，使 Origin 和 CSRF 同源校验使用同一口径。
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_request_buffering off;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
