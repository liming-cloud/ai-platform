name: quality-gates

on:
  push:
    branches: ["master", "codex/**"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  project-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 验证长期项目控制面
        run: make project-verify

  required-quality:
    needs: project-governance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/console-web/package-lock.json
      - name: 安装确定版本的前端依赖
        working-directory: frontend/console-web
        run: npm ci
      - name: 执行仓库质量门禁
        run: make validate
