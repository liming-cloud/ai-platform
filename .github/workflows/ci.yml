name: 项目治理

on:
  push:
    branches: ["master", "codex/**"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  project-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 验证长期项目控制面
        run: make project-verify
      - name: 验证前后端架构门禁
        run: make architecture-guard
